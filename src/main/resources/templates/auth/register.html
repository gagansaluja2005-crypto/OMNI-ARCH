<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Create Account - Job Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 0;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        p.subtitle {
            color: #64748b;
            text-align: center;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }
        .role-notice {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            color: #1e40af;
        }
        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 0.625rem;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: #64748b;
        }
        .links a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h1 th:text="${title}">Create Account</h1>
    <p class="subtitle">Join as a Job Seeker or Employer</p>

    <div class="role-notice">
        <strong>Registration Policy:</strong> Only <strong>JOB_SEEKER</strong> and <strong>EMPLOYER</strong> roles are available for public registration. ADMIN accounts are separately provisioned.
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="jane@example.com" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number (E.164)</label>
            <input type="tel" id="phone" name="phone" placeholder="+12025550143" required>
        </div>
        <div class="form-group">
            <label for="password">Password (min 8 chars)</label>
            <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" required>
        </div>
        <div class="form-group">
            <label for="role">Register As</label>
            <select id="role" name="role" required>
                <option value="JOB_SEEKER">Job Seeker (Candidate)</option>
                <option value="EMPLOYER">Employer / Hiring Manager</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Sign Up</button>
    </form>

    <div class="links">
        Already have an account? <a href="/login">Sign In</a>
        <br><br>
        <a href="/">← Back to Home</a>
    </div>
</div>

</body>
</html>
