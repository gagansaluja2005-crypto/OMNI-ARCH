# TalentVela - OMNI ARCH Application Configuration
spring.application.name=TalentVela
server.port=8080

# Thymeleaf development settings (disable cache for immediate page refresh in browser)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Upload limits for resume files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JPA & H2 SQL Configuration
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

